# ===== Тестовые данные для логина/профиля =====
# файл в UTF-8

# Базовый адрес стенда/прода (можно переопределить -Dbase.url=...)
base.url=https://pikabu.ru

# Валидный пользователь (если реального нет — оставить фиктивным; тесты авторизации у нас мягкие)
user.valid.username=wertygjh
user.valid.email=test@example.com
user.valid.password=password1

# Невалидные данные (используются в негативных проверках)
user.invalid.username=ab
user.invalid.email=invalid-email
user.invalid.password=12345

# Технические настройки (если BaseTest их читает — пригодится; иначе просто игнорируются)
browser=chrome
page.load.timeout.seconds=300
implicit.wait.ms=0
explicit.wait.seconds=10
